<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Wiki</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    window.mermaid = mermaid;
    mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose' });
  </script>
</head>
<body>
  <header id="topbar">
    <div class="brand"><span id="repo-name">Code Wiki</span><span class="tag" id="derived"></span></div>
    <div class="topbar-right">
      <input id="search" type="search" placeholder="filter chapters…" />
      <button id="lang-toggle" title="中 / EN">中文</button>
    </div>
  </header>
  <div id="layout">
    <nav id="sidebar"><div class="side-title" id="side-title">Chapters</div><ul id="nav-list"></ul></nav>
    <main id="content"><div class="placeholder" id="placeholder">Loading…</div></main>
  </div>
  <script src="./app.js"></script>
</body>
</html>
